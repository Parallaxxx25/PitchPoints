[project]
name = "pitchpoints"
version = "0.1.0"
description = "AI match insights engine for synthetic football matches."
requires-python = ">=3.12"
dependencies = [
    "pitchpoints-agents",
    "pitchpoints-contracts",
    "pitchpoints-devserver",
    "pitchpoints-insights",
    "pitchpoints-scoring",
    "pitchpoints-simulator",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/devserver"]

[tool.uv.sources]
pitchpoints-agents = { workspace = true }
pitchpoints-contracts = { workspace = true }
pitchpoints-devserver = { workspace = true }
pitchpoints-insights = { workspace = true }
pitchpoints-scoring = { workspace = true }
pitchpoints-simulator = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line width is the formatter's job; data tables keep `fmt: skip`

[tool.ruff.lint.isort]
known-first-party = ["agents", "contracts", "devserver", "insights", "scoring", "simulator"]

[tool.mypy]
strict = true
files = ["packages", "services", "tests"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]
