[project]
name = "pitchpoints-contracts"
version = "0.1.0"
description = "Pydantic data contracts shared by every PitchPoints component."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "contracts"
