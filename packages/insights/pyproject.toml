[project]
name = "pitchpoints-insights"
version = "0.1.0"
description = "Deterministic match stats, tactical indices, key moments, and overlay cue data."
requires-python = ">=3.12"
dependencies = [
    "pitchpoints-contracts",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "insights"

[tool.uv.sources]
pitchpoints-contracts = { workspace = true }
