[project]
name = "pitchpoints-devserver"
version = "0.1.0"
description = "Local FastAPI live pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
devserver = "devserver.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devserver"
